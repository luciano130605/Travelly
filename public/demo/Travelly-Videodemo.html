<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travelly · Demo</title>

  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0
    }

    :root {

      --bg: #0d0b09;
      --tx: #f4f1ec;
      --g1: #a8a39b;
      --g2: #6f6a63;
      --ln: #26231f;
      --pn: #161411;
      --ac: #4c9aff;
      --ink-d: #1c130d;
      --ink2: rgba(28, 19, 13, .6);
      --gr:
        radial-gradient(80% 70% at 0% 0%,
          rgba(37, 71, 232, 0.18) 0%,
          transparent 65%),
        radial-gradient(70% 60% at 100% 45%,
          rgba(240, 238, 234, 0.9) 0%,
          transparent 70%),
        linear-gradient(135deg,
          #faf8f5 0%,
          #f0eeea 100%);

    }

    html,
    body {
      height: 100%;
      background: var(--gr);
      color: var(--tx);
      font-family: Geist, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden
    }

    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      background: transparent;
      overflow: hidden;
      transform-origin: center
    }

    .fade {
      opacity: 0;
      transition: opacity .9s ease
    }

    .fade.in {
      opacity: 1
    }

    /* Teléfono */
    #phoneW {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(var(--ps, 1));
      transition: transform 1.6s cubic-bezier(.3, .1, .2, 1), opacity 1s ease;
      opacity: 0
    }

    #phone {
      width: 340px;
      height: 700px;
      border-radius: 54px;
      background: #050404;
      border: 1px solid #34302b;
      padding: 9px;
      box-shadow: 0 30px 70px rgba(60, 20, 10, .35), 0 0 0 1px #000
    }

    #screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 45px;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: opacity .9s ease
    }

    #screen.off {
      opacity: 0
    }

    #isl {
      position: absolute;
      top: 11px;
      left: 50%;
      width: 96px;
      height: 27px;
      margin-left: -48px;
      border-radius: 20px;
      background: #000;
      z-index: 5
    }

    /* Cabecera con contexto del viaje */
    #hd {
      padding: 54px 22px 14px;
      border-bottom: 1px solid var(--ln)
    }

    #hd b {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -.02em;
      display: block
    }

    #hd .on {
      font-size: 12px;
      color: var(--g1);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    #hd .brand {
      display: flex;
      align-items: center;
      gap: 10px
    }

    #hd .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain
    }

    #lines .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 18px
    }

    .port #lines .logo {
      width: 150px;
      height: 150px
    }

    #hd .on i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ac)
    }

    #hd .loc {
      font-size: 12.5px;
      color: var(--g1);
      margin-top: 10px;
      font-weight: 500
    }

    #hd .ctx {
      min-height: 16px;
      font-size: 12px;
      color: var(--g1);
      margin-top: 3px;
      font-variant-numeric: tabular-nums
    }

    /* Chat */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 14px;
      padding: 16px 20px 12px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(transparent, #000 70px);
      mask-image: linear-gradient(transparent, #000 70px);
      transition: opacity .35s
    }

    #chat>div {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .25s ease, transform .25s ease;
      flex: none
    }

    #chat>div.in {
      opacity: 1;
      transform: none
    }

    .u {
      align-self: flex-end;
      max-width: 78%;
      background: #25221e;
      padding: 10px 14px;
      border-radius: 18px 18px 6px 18px;
      font-size: 14.5px;
      line-height: 1.35
    }

    .t {
      font-size: 15px;
      line-height: 1.4;
      color: var(--tx);
      max-width: 92%
    }

    .think {
      font-size: 13px;
      background: linear-gradient(90deg, var(--g2) 30%, #e9e5de 50%, var(--g2) 70%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sh 1.4s linear infinite
    }

    @keyframes sh {
      from {
        background-position: 120% 0
      }

      to {
        background-position: -100% 0
      }
    }

    .card {
      border: 1px solid var(--ln);
      background: var(--pn);
      border-radius: 16px;
      padding: 14px
    }

    .card .n {
      font-size: 12px;
      letter-spacing: .08em;
      font-weight: 500
    }

    .card .m {
      margin-top: 6px;
      font-size: 13px;
      color: var(--g1)
    }

    .card .w {
      margin-top: 8px;
      font-size: 13px;
      color: var(--tx);
      line-height: 1.35
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .b {
      flex: 1;
      border: 1px solid #38342e;
      background: transparent;
      color: var(--tx);
      font: 500 12.5px Geist, system-ui, sans-serif;
      padding: 9px 6px;
      border-radius: 11px;
      transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease
    }

    .b.p {
      background: var(--ac);
      border-color: var(--ac);
      color: #06121f
    }

    .b.press {
      transform: scale(.94);
      background: #3a3731
    }

    .b.p.press {
      background: #2f78d6
    }

    .b.p.done {
      background: transparent;
      border-color: var(--ac);
      color: var(--ac)
    }

    .opts>div {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 11px 0 11px 12px;
      border-bottom: 1px solid var(--ln);
      font-size: 14px;
      position: relative
    }

    .opts>div:last-child {
      border: 0
    }

    .opts small {
      color: var(--g1);
      font-size: 12.5px
    }

    .opts .r {
      color: var(--tx)
    }

    .opts .r:before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: var(--ac);
      border-radius: 2px
    }

    .opts div:not(.r) {
      color: var(--g1)
    }

    /* Compositor */
    #comp {
      margin: 0 14px 18px;
      height: 46px;
      border-radius: 23px;
      border: 1px solid #2f2b26;
      display: flex;
      align-items: center;
      padding: 0 6px 0 18px;
      font-size: 14px;
      color: var(--g2);
      gap: 8px;
      transition: border-color .2s
    }

    #comp.on {
      border-color: #4a453e
    }

    #typed {
      color: var(--tx);
      flex: 1;
      white-space: nowrap;
      overflow: hidden
    }

    #ph {
      flex: 1
    }

    #comp.on #ph {
      display: none
    }

    #typed:empty {
      display: none
    }

    #comp.on #typed:empty {
      display: block;
      flex: 1
    }

    #snd {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #25221e;
      color: var(--g2);
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: background .2s, color .2s
    }

    #comp.on #snd {
      background: var(--ac);
      color: #06121f
    }

    /* Aviso */
    #toast {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translate(-50%, -16px);
      opacity: 0;
      background: #f4f1ec;
      color: #0d0b09;
      font-size: 12.5px;
      font-weight: 500;
      padding: 9px 15px;
      border-radius: 99px;
      white-space: nowrap;
      transition: all .28s ease;
      z-index: 6;
      display: flex;
      gap: 8px;
      align-items: center
    }

    #toast i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ac)
    }

    #toast.in {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    /* Itinerario */
    #sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--pn);
      border-top: 1px solid #2f2b26;
      border-radius: 26px 26px 0 0;
      padding: 14px 22px 34px;
      transform: translateY(105%);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
      z-index: 4;
      box-shadow: 0 -20px 40px rgba(0, 0, 0, .4)
    }

    #sheet.in {
      transform: none
    }

    #sheet h4 {
      font-size: 16px;
      font-weight: 600;
      margin: 6px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline
    }

    #sheet h4 small {
      font-size: 12px;
      color: var(--g2);
      font-weight: 400
    }

    #sheet .g {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #3a3631;
      margin: 0 auto
    }

    .row {
      display: flex;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid var(--ln);
      font-size: 14px;
      overflow: hidden;
      max-height: 60px
    }

    .row:last-child {
      border: 0
    }

    .row span {
      color: var(--g2);
      width: 44px;
      font-variant-numeric: tabular-nums
    }

    .row.new {
      animation: nr .5s ease both;
      position: relative;
      color: var(--tx)
    }

    .row.new span {
      color: var(--ac)
    }

    .row.new:before {
      content: "";
      position: absolute;
      left: -12px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: var(--ac)
    }

    .row:not(.new) {
      color: var(--g1)
    }

    @keyframes nr {
      from {
        max-height: 0;
        opacity: 0;
        padding: 0
      }

      to {
        max-height: 60px;
        opacity: 1
      }
    }

    /* Mapa */
    #map {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      transition: opacity .45s ease
    }

    #map.in {
      opacity: 1
    }

    #map svg {
      position: absolute;
      top: 100px;
      left: 0;
      width: 100%
    }

    #map .inf {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 34px;
      border-top: 1px solid var(--ln);
      padding-top: 14px;
      font-size: 15px;
      display: flex;
      justify-content: space-between
    }

    #map .inf small {
      color: var(--g1);
      font-size: 13px
    }

    #route {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      transition: stroke-dashoffset 1.6s ease
    }

    #map.in #route {
      stroke-dashoffset: 0
    }

    /* Cierre */
    #lines {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      padding: 0 70px
    }

    #lines p {
      font-size: 46px;
      font-weight: 500;
      letter-spacing: -.03em;
      line-height: 1.15;
      color: var(--ink-d)
    }

    #lines p.d {
      font-weight: 300;
      color: var(--ink2)
    }

    #lines .s {
      margin-top: 28px;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -.01em;
      color: var(--ink2)
    }

    .port #lines p {
      font-size: 54px
    }

    #rp {
      position: absolute;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);
      z-index: 10;
      background: none;
      border: 1px solid rgba(28, 19, 13, .35);
      color: var(--ac);
      font: 400 14px Geist, system-ui, sans-serif;
      padding: 10px 22px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s
    }

    .think {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .think img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    @keyframes bob {
      50% {
        transform: translateY(-3px)
      }
    }

    #rp.in {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer
    }

    /* Mobile: sin marco de teléfono, la app ocupa todo el iframe */
    .flat #phoneW {
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: none
    }

    .flat #phone {
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none
    }

    .flat #screen {
      border-radius: 0
    }

    .flat #isl {
      display: none
    }

    .flat #hd {
      padding: 18px 20px 12px
    }

    .flat #toast {
      top: 12px
    }

    .flat #sheet {
      padding: 14px 20px 26px
    }

    .flat #map svg {
      top: 64px
    }

    .flat #map .inf {
      bottom: 24px
    }

    /* Cierre con tipografías para pantalla chica */
    .flat #lines {
      padding: 0 24px
    }

    .flat #lines .logo {
      width: 88px;
      height: 88px;
      margin-bottom: 14px
    }

    .flat #lines p {
      font-size: clamp(28px, 9vw, 40px)
    }

    .flat #lines .s {
      margin-top: 20px;
      font-size: 18px
    }

    @media (prefers-reduced-motion:reduce) {

      #chat>div,
      .fade {
        transition-duration: .01s
      }

      .think {
        animation: none;
        color: var(--g1);
        background: none
      }
    }
  </style>
</head>

<body>
  <div id="stage" class="land">
    <div id="lines">
      <img id="lg" class="logo fade" src="travy.png" alt="">
      <p id="l1" class="fade"></p>
      <p id="l2" class="d fade"></p>
      <div class="s fade" id="l3"></div>
    </div>

    <div id="phoneW">
      <div id="phone">
        <div id="screen">
          <div id="isl"></div>
          <div id="toast"><i></i><span id="tt"></span></div>
          <div id="hd">
            <div class="brand">
              <img src="../travy-sm.png" alt="">
              <div>
                <b>Travy</b>
                <div class="on"><i></i>En línea</div>
              </div>
            </div>
            <div class="loc" id="lc">Nuevo viaje</div>
            <div class="ctx" id="cx"></div>
          </div>
          <div id="chat"></div>
          <div id="comp"><span id="ph">Preguntale a Travy</span><span id="typed"></span><span id="snd">&uarr;</span>
          </div>
          <div id="sheet"></div>
          <div id="map"><svg viewBox="0 0 340 380" fill="none">
              <g stroke="#1f1c18" stroke-width="1">
                <path d="M0 60H340M0 140H340M0 220H340M0 300H340M60 0V380M140 0V380M230 0V380M300 0V380" />
              </g>
              <path d="M-10 330C80 290 140 340 240 270S330 250 350 230" stroke="#1d2530" stroke-width="22"
                stroke-linecap="round" />
              <path id="route" d="M70 70H140V140H230V220H270" stroke="#4c9aff" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round" />
              <circle cx="70" cy="70" r="6" fill="#f4f1ec" />
              <circle cx="270" cy="220" r="6" fill="#4c9aff" />
              <text x="82" y="62" fill="#a8a39b" font-size="12" font-family="Geist,system-ui,sans-serif">Mori Art
                Museum</text>
              <text x="228" y="248" fill="#a8a39b" font-size="12" font-family="Geist,system-ui,sans-serif">Hotel</text>
            </svg>
            <div class="inf">
              <div>Metro<br><small>Mori Art Museum → Hotel</small></div>
              <div style="text-align:right">22 min<br><small>$210</small></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button id="rp">Ver de nuevo</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)

    const theme = params.get('theme')

    const mobile = params.get('mobile')
      ? params.get('mobile') === '1'
      : Math.min(screen.width, screen.height) < 768

    if (theme === 'light' || theme === 'dark') {
      document.documentElement.dataset.theme = theme
    }
    const $ = s => document.querySelector(s), sleep = ms => new Promise(r => setTimeout(r, ms));
    const st = $('#stage'), chat = $('#chat'), W = $('#phoneW');
    let base = 1.1;
    function fit() {
      const iw = innerWidth, ih = innerHeight;


      const p = iw / ih < 1;
      const w = p ? 900 : Math.round(900 * iw / ih), h = p ? Math.round(900 * ih / iw) : 900;
      st.className = p ? 'port' : 'land';
      st.style.width = w + 'px'; st.style.height = h + 'px';
      st.style.transform = 'translate(-50%,-50%) scale(' + iw / w + ')';
      base = mobile
        ? Math.min(h * .96 / 700, w * .94 / 340)
        : Math.min(h * .8 / 700, w * .78 / 340);
      if (!W.dataset.m) W.dataset.m = 1; ph(+W.dataset.m);
    }
    function ph(m) { W.dataset.m = m; W.style.setProperty('--ps', base * m) }
    addEventListener('resize', fit); fit();

    function add(h, c) {
      const d = document.createElement('div'); d.className = c || ''; d.innerHTML = h; chat.appendChild(d);
      requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('in'))); return d
    }
    async function user(t) {
      const c = $('#typed'), p = $('#comp'); p.classList.add('on');
      for (const ch of t) { c.textContent += ch; await sleep(28) } await sleep(350);
      c.textContent = ''; p.classList.remove('on'); add(t, 'u'); await sleep(400)
    }
    async function press(b) { b.classList.add('press'); await sleep(190); b.classList.remove('press') }
    async function toast(t) { $('#tt').textContent = t; $('#toast').classList.add('in'); await sleep(1700); $('#toast').classList.remove('in') }
    const row = (r, c) => '<div class="row' + (c || '') + '"><span>' + r[0] + '</span>' + r[1] + '</div>';
    async function sheet(title, sub, rows, ni) {
      $('#sheet').innerHTML = '<div class="g"></div><h4>' + title + '<small>' + sub + '</small></h4><div id="rw">' + rows.filter((_, i) => i !== ni).map(r => row(r)).join('') + '</div>';
      $('#sheet').classList.add('in'); await sleep(700);
      const rw = $('#rw'), d = document.createElement('div'); d.className = 'row new'; d.innerHTML = '<span>' + rows[ni][0] + '</span>' + rows[ni][1];
      rw.insertBefore(d, rw.children[ni] || null);
      await sleep(2400); $('#sheet').classList.remove('in'); await sleep(450)
    }
    const say = (h, c) => add(h, c);
    async function think(ms) {
      const k = add('<div class="think"><img src="../travy-chat.png" alt="">Travy está revisando tu viaje…</div>');
      await sleep(ms); k.remove()

    }
    const show = (id, on) => $(id).classList[on ? 'add' : 'remove']('in');

    async function main() {
      await sleep(300); W.style.opacity = 1; await sleep(1000);
      // Escena A — crear el viaje
      await user('Quiero armar un viaje a Tokio del 12 al 24 de septiembre.');
      await think(900);
      say('Listo, ya lo creé. Esto es lo que tenés hasta ahora:', 't'); await sleep(400);
      const v = say('<div class="card"><div class="n">TOKIO</div><div class="m">12 sep — 24 sep · 12 días</div><div class="opts" style="margin-top:6px"><div class="r">Clima<small>18° — 24°</small></div><div>Requisitos<small>Todo listo</small></div><div>Equipaje<small>87% listo</small></div></div><div class="btns"><button class="b p">Organizar mi viaje</button></div></div>');
      await sleep(1500); await press(v.querySelector('.p')); toast('Viaje agregado · Tokio'); await sleep(700);

      // Escena B — organizar el primer día
      await user('Organizá mi primer día.');
      await think(1000);
      say('Armé el lunes según lo que te gusta. Ojo: a las 16:00 va a llover.', 't'); await sleep(500);
      await sheet('Lunes · 12 sep', 'Plan actualizado', [['09:00', 'Desayuno'], ['10:30', 'Senso-ji'], ['14:00', 'Paseo por Asakusa'], ['17:00', 'Mori Art Museum']], 3);
      say('Moví lo de afuera para antes de la lluvia y dejé el museo para la tarde.', 't'); await sleep(1700);

      // Pasan los días: ya estás viajando
      chat.style.opacity = 0; await sleep(350); chat.innerHTML = '';
      $('#lc').textContent = 'Tokyo · Día 4 de 12'; $('#cx').textContent = '16:10 · 18°C · Lluvia'; $('#lc').style.color = 'var(--tx)';
      chat.style.opacity = 1; toast('Día 4 de 12 · ya estás en Tokio'); await sleep(1000);

      // Escena 1 — contexto
      await user('¿Qué puedo hacer ahora?');
      say('Tenés 3 horas libres antes de tu próxima actividad.', 't'); await sleep(1100);
      await user('Está lloviendo y no quiero caminar mucho.');

      // Escena 2 — Travy entiende y recomienda
      await think(1300);
      say('Entonces cambiaría el plan.', 't'); await sleep(450);
      const c = say('<div class="card"><div class="n">MORI ART MUSEUM</div><div class="m">14 min · $2.000</div><div class="w">Encaja con tus intereses y está cerca de vos.</div><div class="btns"><button class="b">Ver lugar</button><button class="b p">Agregar al itinerario</button></div></div>');
      await sleep(1500);

      // Escena 3 — Travy actúa
      const b = c.querySelector('.p'); await press(b); b.textContent = 'Agregado'; b.classList.add('done');
      toast('Agregado a tu itinerario · 16:30'); await sleep(650);
      await sheet('Hoy', 'Día 4 · Tokyo', [['13:00', 'Almuerzo en Nakameguro'], ['16:30', 'Mori Art Museum'], ['19:30', 'Cena en Ebisu']], 1);

      // Escena 4 — segunda acción
      await user('¿Y cómo vuelvo al hotel después?');
      say('Desde el museo tenés 3 opciones.', 't'); await sleep(500);
      say('<div class="opts"><div class="r">Metro<small>22 min · $210</small></div><div>Taxi<small>12 min · ~$1.800</small></div><div>Caminando<small>38 min</small></div></div>'); await sleep(900);
      const r = say('<div class="t">Te recomiendo Metro.</div><div class="btns"><button class="b p">Ver cómo llegar</button></div>'); await sleep(1100);

      // Escena 5 — mapa
      await press(r.querySelector('.p')); show('#map', 1); await sleep(3200); show('#map', 0); await sleep(500);

      // Escena 6 — cierre
      $('#screen').classList.add('off'); await sleep(900);
      ph(.9); W.style.opacity = 0; await sleep(900);
      show('#lg', 1); await sleep(500);   
      $('#l1').textContent = 'No necesitás buscar.'; show('#l1', 1); await sleep(1300);
      $('#l2').textContent = 'Solo preguntale a Travy.'; show('#l2', 1); await sleep(2200);
      show('#l1', 0); show('#l2', 0); await sleep(1000);   // el logo se queda
      $('#l1').textContent = 'Tu viaje.'; $('#l2').textContent = 'Mucho más fácil.'; $('#l3').textContent = 'Travelly';
      show('#l1', 1); await sleep(500); show('#l2', 1); await sleep(700); show('#l3', 1);
      await sleep(2400); $('#rp').classList.add('in');
    }
    function reset() {
      ['#lg', '#l1', '#l2', '#l3', '#map', '#sheet', '#toast'].forEach(i => show(i, 0));
      chat.innerHTML = ''; $('#rp').classList.remove('in'); $('#screen').classList.remove('off');
      W.style.opacity = 0; ph(1); $('#typed').textContent = ''; $('#comp').classList.remove('on');
      $('#lc').textContent = 'Nuevo viaje'; $('#lc').style.color = ''; $('#cx').textContent = ''; chat.style.opacity = 1
    }
    $('#rp').onclick = () => { reset(); setTimeout(main, 900) };
    main();
  </script>
</body>

</html>
